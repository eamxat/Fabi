        // 6. Efecto Interactivo PREMIUM SOFT GLOW en el Render Principal de FABI
        (function initFabiSoftGlow() {
            const glowWrap = document.getElementById('fabi-glow-card');
            if (!glowWrap) return;

            const isTouchDevice = window.matchMedia('(hover: none), (pointer: coarse)').matches;
            if (isTouchDevice) return;

            let targetX = 50;
            let targetY = 50;
            let currentX = 50;
            let currentY = 50;
            let isHovering = false;
            let rafId = null;

            function updateGlowPosition() {
                currentX += (targetX - currentX) * 0.14;
                currentY += (targetY - currentY) * 0.14;

                glowWrap.style.setProperty('--glow-x', `${currentX.toFixed(2)}%`);
                glowWrap.style.setProperty('--glow-y', `${currentY.toFixed(2)}%`);

                const stillMoving =
                    Math.abs(targetX - currentX) > 0.08 ||
                    Math.abs(targetY - currentY) > 0.08;

                if (isHovering || stillMoving) {
                    rafId = requestAnimationFrame(updateGlowPosition);
                } else {
                    rafId = null;
                }
            }

            function startGlowLoop() {
                if (!rafId) {
                    rafId = requestAnimationFrame(updateGlowPosition);
                }
            }

            glowWrap.addEventListener('mouseenter', () => {
                isHovering = true;
                glowWrap.style.setProperty('--glow-opacity', '1');
                startGlowLoop();
            });

            glowWrap.addEventListener('mousemove', (e) => {
                const rect = glowWrap.getBoundingClientRect();
                if (!rect.width || !rect.height) return;

                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                targetX = Math.max(0, Math.min(100, (x / rect.width) * 100));
                targetY = Math.max(0, Math.min(100, (y / rect.height) * 100));

                startGlowLoop();
            });

            glowWrap.addEventListener('mouseleave', () => {
                isHovering = false;
                targetX = 50;
                targetY = 50;
                glowWrap.style.setProperty('--glow-opacity', '0');
                startGlowLoop();
            });
        })();

        // 6.5 Destellos luminosos aleatorios en la interfaz utilizando el recurso original shine2.png
        (function initAmbientInterfaceSparkles() {
            const targetSelectors = [
                '#music-player-card',
                '#cover-carousel-3d',
                '#pisces-info-card',
                '#clock-info-card',
                '.gif-card',
                '#hero-section > .glass-pink-solid'
            ];

            let activeSparkles = 0;
            const MAX_SPARKLES = 5;

            function spawnRandomSparkle() {
                if (document.hidden || activeSparkles >= MAX_SPARKLES) return;

                const candidates = document.querySelectorAll(targetSelectors.join(','));
                if (!candidates.length) return;

                const container = candidates[Math.floor(Math.random() * candidates.length)];
                if (!container) return;

                activeSparkles++;
                const sp = document.createElement('span');
                sp.className = 'ui-ambient-sparkle';
                sp.setAttribute('aria-hidden', 'true');

                // Posiciones en bordes y zonas libres para no cubrir textos ni controles centrales
                const edgeZone = Math.random() > 0.5;
                const posX = edgeZone ? (4 + Math.random() * 18) : (74 + Math.random() * 20);
                const posY = 6 + Math.random() * 82;
                const size = 20 + Math.random() * 16; // 20px a 36px para apreciar nitidez de shine2.png
                const dur = (1.9 + Math.random() * 1.3).toFixed(2);
                const maxOp = (0.68 + Math.random() * 0.28).toFixed(2);

                sp.style.width = `${size.toFixed(1)}px`;
                sp.style.height = `${size.toFixed(1)}px`;
                sp.style.left = `${posX.toFixed(1)}%`;
                sp.style.top = `${posY.toFixed(1)}%`;
                sp.style.setProperty('--sp-dur', `${dur}s`);
                sp.style.setProperty('--sp-op', maxOp);

                container.appendChild(sp);

                const removeSparkle = () => {
                    if (sp.parentNode) sp.parentNode.removeChild(sp);
                    activeSparkles = Math.max(0, activeSparkles - 1);
                };

                sp.addEventListener('animationend', removeSparkle, { once: true });
                setTimeout(removeSparkle, parseFloat(dur) * 1000 + 150);
            }

            setInterval(() => {
                spawnRandomSparkle();
                if (Math.random() > 0.55) {
                    setTimeout(spawnRandomSparkle, 450);
                }
            }, 1400);
        })();

        // 6.8 Efecto de destellos (sparkles) al mover el cursor con limitación de frecuencia para máximo rendimiento
        (function initCursorSparkleTrail() {
            const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
            if (isTouch) return;

            let lastSpawnTime = 0;
            let lastX = 0;
            let lastY = 0;
            let activeCursorSparkles = 0;
            const MAX_CURSOR_SPARKLES = 22;
            const SPARKLE_COLORS = [
                'radial-gradient(circle, #ffffff 20%, #ffb6d3 80%)',
                'radial-gradient(circle, #ffffff 30%, #ffd6e7 85%)',
                'radial-gradient(circle, #fff5f9 25%, #ff85b3 85%)'
            ];

            window.addEventListener('pointermove', (e) => {
                const now = performance.now();
                if (now - lastSpawnTime < 34 || activeCursorSparkles >= MAX_CURSOR_SPARKLES) return;

                const dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
                if (dist < 10) return;

                lastSpawnTime = now;
                lastX = e.clientX;
                lastY = e.clientY;
                activeCursorSparkles++;

                const sp = document.createElement('span');
                sp.className = 'cursor-sparkle-particle';
                sp.setAttribute('aria-hidden', 'true');

                const size = 6 + Math.random() * 6; // 6px a 12px
                const dx = (Math.random() - 0.5) * 24;
                const dy = 8 + Math.random() * 18;
                const dur = Math.round(460 + Math.random() * 240);
                const bg = SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)];

                sp.style.width = `${size.toFixed(1)}px`;
                sp.style.height = `${size.toFixed(1)}px`;
                sp.style.left = `${e.clientX - size / 2}px`;
                sp.style.top = `${e.clientY - size / 2}px`;
                sp.style.background = bg;
                sp.style.boxShadow = '0 0 6px rgba(255, 255, 255, 0.9)';
                sp.style.setProperty('--cs-dx', `${dx.toFixed(1)}px`);
                sp.style.setProperty('--cs-dy', `${dy.toFixed(1)}px`);
                sp.style.setProperty('--cs-dur', `${dur}ms`);

                document.body.appendChild(sp);

                const cleanup = () => {
                    if (sp.parentNode) sp.parentNode.removeChild(sp);
                    activeCursorSparkles = Math.max(0, activeCursorSparkles - 1);
                };

                sp.addEventListener('animationend', cleanup, { once: true });
                setTimeout(cleanup, dur + 80);
            }, { passive: true });
        })();

        // 6.9 Simulación Liquid WebGL (Navier-Stokes Shaders) sobre background3.png + Clic en el fondo para ocultar/mostrar todo el Hub
        (function initWebGLLiquidBackground() {
            const canvasEl = document.getElementById('liquid-bg-canvas');
            if (!canvasEl) return;

            const params = {
                cursorSize: 2,
                cursorPower: 24,
                distortionPower: 0.4
            };

            const pointer = {
                x: 0.65 * window.innerWidth,
                y: 0.5 * window.innerHeight,
                dx: 0,
                dy: 0,
                moved: false
            };

            const res = { w: 256, h: 256 };
            let outputColor, velocity, divergence, pressure, imageTexture;
            let imgRatio = 16 / 9;
            let isPreview = true;
            let isImageLoaded = false;

            const gl = canvasEl.getContext('webgl', { alpha: false, depth: false, stencil: false, antialias: false }) ||
                       canvasEl.getContext('experimental-webgl');
            if (!gl) return;

            const floatExt = gl.getExtension('OES_texture_float');
            const halfFloatExt = gl.getExtension('OES_texture_half_float');
            const fboTexType = floatExt ? gl.FLOAT : (halfFloatExt ? halfFloatExt.HALF_FLOAT_OES : gl.UNSIGNED_BYTE);

            function createShader(sourceCode, type) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, sourceCode);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }

            function createShaderProgram(vertexShader, fragmentShader) {
                const program = gl.createProgram();
                gl.attachShader(program, vertexShader);
                gl.attachShader(program, fragmentShader);
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    return null;
                }
                return program;
            }

            function getUniforms(program) {
                const uniforms = {};
                const uniformCount = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
                for (let i = 0; i < uniformCount; i++) {
                    const uniformName = gl.getActiveUniform(program, i).name;
                    uniforms[uniformName] = gl.getUniformLocation(program, uniformName);
                }
                return uniforms;
            }

            const vertexShader = createShader(document.getElementById('vertShader').innerHTML, gl.VERTEX_SHADER);

            function createProgram(elId) {
                const shader = createShader(document.getElementById(elId).innerHTML, gl.FRAGMENT_SHADER);
                const program = createShaderProgram(vertexShader, shader);
                const uniforms = getUniforms(program);
                return { program, uniforms };
            }

            const splatProgram = createProgram('fragShaderPoint');
            const divergenceProgram = createProgram('fragShaderDivergence');
            const pressureProgram = createProgram('fragShaderPressure');
            const gradientSubtractProgram = createProgram('fragShaderGradientSubtract');
            const advectionProgram = createProgram('fragShaderAdvection');
            const displayProgram = createProgram('fragShaderOutputShader');

            // Buffers reutilizables de geometría para máximo rendimiento (sin crear buffers nuevos en cada frame)
            const quadVertexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, quadVertexBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);

            const quadIndexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIndexBuffer);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);

            function blit(target) {
                gl.bindBuffer(gl.ARRAY_BUFFER, quadVertexBuffer);
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIndexBuffer);
                gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(0);

                if (target == null) {
                    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                } else {
                    gl.viewport(0, 0, target.width, target.height);
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
                }
                gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
            }

            function createFBO(w, h, texType) {
                gl.activeTexture(gl.TEXTURE0);
                const texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, texType, null);

                const fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);

                const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
                if (status !== gl.FRAMEBUFFER_COMPLETE && texType !== gl.UNSIGNED_BYTE) {
                    gl.deleteFramebuffer(fbo);
                    gl.deleteTexture(texture);
                    return createFBO(w, h, halfFloatExt && texType === gl.FLOAT ? halfFloatExt.HALF_FLOAT_OES : gl.UNSIGNED_BYTE);
                }

                gl.viewport(0, 0, w, h);
                gl.clear(gl.COLOR_BUFFER_BIT);

                return {
                    fbo,
                    width: w,
                    height: h,
                    attach(id) {
                        gl.activeTexture(gl.TEXTURE0 + id);
                        gl.bindTexture(gl.TEXTURE_2D, texture);
                        return id;
                    }
                };
            }

            function createDoubleFBO(w, h) {
                let fbo1 = createFBO(w, h, fboTexType);
                let fbo2 = createFBO(w, h, fboTexType);

                return {
                    width: w,
                    height: h,
                    texelSizeX: 1.0 / w,
                    texelSizeY: 1.0 / h,
                    read: () => fbo1,
                    write: () => fbo2,
                    swap() {
                        const temp = fbo1;
                        fbo1 = fbo2;
                        fbo2 = temp;
                    }
                };
            }

            function initFBOs() {
                outputColor = createDoubleFBO(res.w, res.h);
                velocity = createDoubleFBO(res.w, res.h);
                divergence = createFBO(res.w, res.h, fboTexType);
                pressure = createDoubleFBO(res.w, res.h);
            }

            function resizeCanvas() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvasEl.width = Math.round(window.innerWidth * dpr);
                canvasEl.height = Math.round(window.innerHeight * dpr);
                const ratio = window.innerWidth / Math.max(1, window.innerHeight);
                res.w = Math.max(192, Math.round(320 * ratio));
                res.h = 320;
            }

            function loadImage(src) {
                const image = new Image();
                image.crossOrigin = 'anonymous';
                image.src = src;
                image.onload = () => {
                    imgRatio = image.naturalWidth / Math.max(1, image.naturalHeight);
                    imageTexture = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, imageTexture);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, imageTexture);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
                    isImageLoaded = true;
                };
            }

            function updatePointerPosition(eX, eY, boost = 6) {
                pointer.moved = true;
                pointer.dx = boost * (eX - pointer.x);
                pointer.dy = boost * (eY - pointer.y);
                pointer.x = eX;
                pointer.y = eY;
            }

            window.addEventListener('mousemove', (e) => {
                isPreview = false;
                updatePointerPosition(e.clientX, e.clientY, 6);
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!e.targetTouches || !e.targetTouches[0]) return;
                isPreview = false;
                updatePointerPosition(e.targetTouches[0].clientX, e.targetTouches[0].clientY, 6);
            }, { passive: true });

            window.addEventListener('resize', () => {
                resizeCanvas();
                initFBOs();
                if (imageTexture) {
                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, imageTexture);
                }
            });

            // Al hacer clic en el background se esconde todo el hub y solo queda el fondo con el efecto liquid; al volver a dar clic reaparece todo
            document.addEventListener('click', (e) => {
                isPreview = false;
                updatePointerPosition(e.clientX, e.clientY, 10);

                const introScreen = document.getElementById('intro-screen');
                if (introScreen && !introScreen.classList.contains('is-hidden')) return;

                if (document.body.classList.contains('hub-is-hidden')) {
                    document.body.classList.remove('hub-is-hidden');
                    return;
                }

                const interactiveZone = e.target.closest(
                    'a, button, input, [role="button"], .glass-pink-solid, .glass-white-bordered, .clock-glass-card, .gif-card, .fabi-glow-wrap, #fabi-avatar-trigger, #fabi-avatar-popover, #jhon-married-badge, header h2, header span, header img, footer a'
                );
                if (interactiveZone) return;

                document.body.classList.add('hub-is-hidden');
            });

            function render(t) {
                const dt = 1 / 60;

                if (t && isPreview) {
                    updatePointerPosition(
                        (0.5 + 0.25 * Math.sin(0.002 * t - 3.14)) * window.innerWidth,
                        (0.5 + 0.1 * Math.sin(0.005 * t) * Math.cos(0.002 * t)) * window.innerHeight,
                        6
                    );
                }

                if (pointer.moved) {
                    if (!isPreview) {
                        pointer.moved = false;
                    }

                    gl.useProgram(splatProgram.program);
                    gl.uniform1i(splatProgram.uniforms.u_input_texture, velocity.read().attach(1));
                    gl.uniform1f(splatProgram.uniforms.u_ratio, canvasEl.width / Math.max(1, canvasEl.height));
                    gl.uniform2f(splatProgram.uniforms.u_point, pointer.x / Math.max(1, window.innerWidth), 1 - pointer.y / Math.max(1, window.innerHeight));
                    gl.uniform3f(splatProgram.uniforms.u_point_value, pointer.dx, -pointer.dy, 0);
                    gl.uniform1f(splatProgram.uniforms.u_point_size, params.cursorSize * 0.001);

                    blit(velocity.write());
                    velocity.swap();

                    gl.uniform1i(splatProgram.uniforms.u_input_texture, outputColor.read().attach(1));
                    gl.uniform3f(splatProgram.uniforms.u_point_value, params.cursorPower * 0.001, 0, 0);
                    blit(outputColor.write());
                    outputColor.swap();
                }

                gl.useProgram(divergenceProgram.program);
                gl.uniform2f(divergenceProgram.uniforms.u_texel, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(divergenceProgram.uniforms.u_velocity_texture, velocity.read().attach(1));
                blit(divergence);

                gl.useProgram(pressureProgram.program);
                gl.uniform2f(pressureProgram.uniforms.u_texel, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(pressureProgram.uniforms.u_divergence_texture, divergence.attach(1));
                for (let i = 0; i < 16; i++) {
                    gl.uniform1i(pressureProgram.uniforms.u_pressure_texture, pressure.read().attach(2));
                    blit(pressure.write());
                    pressure.swap();
                }

                gl.useProgram(gradientSubtractProgram.program);
                gl.uniform2f(gradientSubtractProgram.uniforms.u_texel, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(gradientSubtractProgram.uniforms.u_pressure_texture, pressure.read().attach(1));
                gl.uniform1i(gradientSubtractProgram.uniforms.u_velocity_texture, velocity.read().attach(2));
                blit(velocity.write());
                velocity.swap();

                gl.useProgram(advectionProgram.program);
                gl.uniform2f(advectionProgram.uniforms.u_texel, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform2f(advectionProgram.uniforms.u_output_textel, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(advectionProgram.uniforms.u_velocity_texture, velocity.read().attach(1));
                gl.uniform1i(advectionProgram.uniforms.u_input_texture, velocity.read().attach(1));
                gl.uniform1f(advectionProgram.uniforms.u_dt, dt);
                gl.uniform1f(advectionProgram.uniforms.u_dissipation, 0.97);
                blit(velocity.write());
                velocity.swap();

                gl.useProgram(advectionProgram.program);
                gl.uniform2f(advectionProgram.uniforms.u_output_textel, outputColor.texelSizeX, outputColor.texelSizeY);
                gl.uniform1i(advectionProgram.uniforms.u_input_texture, outputColor.read().attach(2));
                gl.uniform1f(advectionProgram.uniforms.u_dt, 8 * dt);
                gl.uniform1f(advectionProgram.uniforms.u_dissipation, 0.98);
                blit(outputColor.write());
                outputColor.swap();

                if (isImageLoaded && imageTexture) {
                    gl.useProgram(displayProgram.program);
                    gl.uniform2f(displayProgram.uniforms.u_point, pointer.x / Math.max(1, window.innerWidth), 1 - pointer.y / Math.max(1, window.innerHeight));
                    gl.uniform2f(displayProgram.uniforms.u_texel, velocity.texelSizeX, velocity.texelSizeY);
                    gl.uniform1i(displayProgram.uniforms.u_velocity_texture, velocity.read().attach(2));
                    gl.uniform1f(displayProgram.uniforms.u_ratio, canvasEl.width / Math.max(1, canvasEl.height));
                    gl.uniform1f(displayProgram.uniforms.u_img_ratio, imgRatio);
                    gl.uniform1f(displayProgram.uniforms.u_disturb_power, params.distortionPower);
                    gl.uniform1i(displayProgram.uniforms.u_output_texture, outputColor.read().attach(1));

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, imageTexture);
                    gl.uniform1i(displayProgram.uniforms.u_text_texture, 0);

                    blit(null);
                }

                requestAnimationFrame(render);
            }

            resizeCanvas();
            initFBOs();
            loadImage('https://raw.githubusercontent.com/eamxat/Fabigifs/refs/heads/main/background3.png');
            requestAnimationFrame(render);
        })();

        // 7. Protección integral de código: eliminación de leyendas nativas (title), bloqueo de F12, clic derecho, atajos de inspección y consola
        (function initCodeAndConsoleProtection() {
            // Elimina cualquier atributo title residual para evitar leyendas nativas del navegador
            document.querySelectorAll('[title]').forEach((el) => el.removeAttribute('title'));

            // Bloqueo de clic derecho (menú contextual) y arrastre de imágenes/elementos
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                return false;
            }, { capture: true });

            document.addEventListener('dragstart', (e) => {
                e.preventDefault();
                return false;
            }, { capture: true });

            // Bloqueo de combinaciones de teclado para abrir DevTools, consola, ver código fuente o guardar página
            window.addEventListener('keydown', (e) => {
                const key = (e.key || '').toUpperCase();
                const code = e.keyCode || e.which;
                const ctrlOrCmd = e.ctrlKey || e.metaKey;

                const isF12 = e.key === 'F12' || code === 123;
                const isDevToolsShortcut = ctrlOrCmd && e.shiftKey && ['I', 'J', 'C', 'K'].includes(key);
                const isMacAltInspector = e.metaKey && e.altKey && ['I', 'J', 'C', 'U'].includes(key);
                const isViewSourceOrSave = ctrlOrCmd && !e.shiftKey && ['U', 'S', 'P'].includes(key);

                if (isF12 || isDevToolsShortcut || isMacAltInspector || isViewSourceOrSave) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
            }, { capture: true });

            // Neutralización y limpieza continua de métodos de consola
            const noop = function () {};
            const consoleMethods = ['log', 'debug', 'info', 'warn', 'error', 'table', 'dir', 'dirxml', 'trace', 'group', 'groupCollapsed', 'groupEnd', 'profile', 'profileEnd', 'count', 'assert'];
            try {
                if (window.console) {
                    consoleMethods.forEach((method) => {
                        if (typeof window.console[method] === 'function') {
                            window.console[method] = noop;
                        }
                    });
                }
            } catch (_) {}

            setInterval(() => {
                try {
                    if (window.console && typeof window.console.clear === 'function') {
                        window.console.clear();
                    }
                } catch (_) {}
            }, 1200);
        })();
    </script>
