<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FABI — Pastel Profile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins & Noto Sans JP for exact typographic feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for crisp icons matching the reference -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        jp: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            50: '#fff8fb',
                            100: '#ffebf3',
                            200: '#ffd6e7',
                            300: '#f7b6cf',
                            400: '#e592b2',
                            500: '#d87a9e',
                            600: '#b85c80',
                            700: '#8c3f5d',
                            800: '#5e283d',
                            900: '#4a2c38',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Unborn 8.0 Pink Pointer - https://www.cursors-4u.com/cursor/unborn-8-0-pink-pointer */
        *, *::before, *::after, html, body, a, button, input {
            cursor: url('https://cdn.cursors-4u.net/previews/unborn-8-0-pink-pointer-19947d27-32.webp') 32 32, auto !important;
        }
        /* End www.Cursors-4U.com Code */

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #4a2c38;
        }

        /* Background Principal Fijo con integración Rosa Pastel y Efecto Liquid WebGL */
        .site-bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image: url('https://raw.githubusercontent.com/eamxat/Fabigifs/refs/heads/main/background3.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: brightness(0.89) saturate(0.86);
        }

        #liquid-bg-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
            display: block;
            filter: brightness(0.89) saturate(0.86);
        }

        /* Transición suave para ocultar y mostrar todo el Hub al hacer clic en el background */
        .hub-main-container {
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.hub-is-hidden .hub-main-container {
            opacity: 0 !important;
            pointer-events: none !important;
            user-select: none;
        }

        /* Sutileza de superposición pastel + ligero degradado inferior profesional */
        .site-bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                linear-gradient(
                    180deg,
                    rgba(255, 240, 247, 0.02) 0%,
                    rgba(216, 122, 158, 0.06) 62%,
                    rgba(88, 28, 52, 0.38) 100%
                ),
                linear-gradient(
                    90deg,
                    rgba(216, 122, 158, 0.18) 0%,
                    rgba(240, 185, 207, 0.10) 45%,
                    rgba(255, 245, 249, 0.18) 100%
                );
        }

        /* Paneles Rosa Pastel Translúcidos (Hero Banner de Renders y Tarjeta de Piscis) — Liquid Glass iOS 26 */
        .glass-pink-solid {
            background: linear-gradient(
                135deg,
                rgba(224, 134, 172, 0.34) 0%,
                rgba(198, 102, 140, 0.22) 100%
            );
            backdrop-filter: blur(12px) saturate(185%);
            -webkit-backdrop-filter: blur(12px) saturate(185%);
            border: 1px solid rgba(255, 206, 226, 0.68);
            box-shadow: 0 18px 38px -8px rgba(105, 38, 66, 0.22),
                        inset 0 1px 1.5px rgba(255, 218, 234, 0.78),
                        inset 0 -1px 1px rgba(255, 192, 218, 0.25);
        }

        /* Contenedor Base Translúcido con Borde Rosa Pastel Claro (Reproductor Musical) — Liquid Glass iOS 26 */
        .glass-white-bordered {
            background: linear-gradient(
                135deg,
                rgba(255, 225, 238, 0.26) 0%,
                rgba(235, 162, 192, 0.14) 100%
            );
            backdrop-filter: blur(12px) saturate(190%);
            -webkit-backdrop-filter: blur(12px) saturate(190%);
            border: 1px solid rgba(255, 206, 226, 0.70);
            box-shadow: 0 14px 32px -8px rgba(105, 38, 66, 0.18),
                        inset 0 1px 1.5px rgba(255, 220, 235, 0.82),
                        inset 0 -1px 1px rgba(255, 194, 218, 0.24);
        }

        /* Recuadro del Reloj y Calendario — Efecto Liquid Glass iOS 26 */
        .clock-glass-card {
            background: linear-gradient(
                135deg,
                rgba(245, 190, 215, 0.24) 0%,
                rgba(216, 130, 165, 0.14) 100%
            );
            backdrop-filter: blur(12px) saturate(190%);
            -webkit-backdrop-filter: blur(12px) saturate(190%);
            border: 1px solid rgba(255, 206, 226, 0.72);
            box-shadow: 0 16px 34px -8px rgba(105, 38, 66, 0.20),
                        inset 0 1px 1.5px rgba(255, 220, 235, 0.82),
                        inset 0 -1px 1px rgba(255, 190, 216, 0.26);
        }

        /* Tarjetas de los 4 Recuadros con GIF — Marco Cristalino Rosa Pastel Claro + Efecto Inner Shine */
        .gif-card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 220, 235, 0.18);
            backdrop-filter: blur(10px) saturate(180%);
            -webkit-backdrop-filter: blur(10px) saturate(180%);
            border: 1px solid rgba(255, 206, 226, 0.72);
            box-shadow: 0 12px 28px -6px rgba(105, 38, 66, 0.20),
                        inset 0 1px 1px rgba(255, 220, 236, 0.75);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.35s ease,
                        border-color 0.35s ease;
        }

        .gif-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 228, 240, 0.95);
            box-shadow: 0 18px 34px -6px rgba(138, 62, 92, 0.32),
                        inset 0 0 18px rgba(255, 235, 244, 0.55);
        }

        /* Barrido luminoso Inner Shine al pasar el cursor sobre cada GIF */
        .gif-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -140%;
            width: 85%;
            height: 100%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 238, 246, 0.56) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-24deg);
            transition: left 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 6;
        }

        .gif-card:hover::after {
            left: 150%;
        }

        .gif-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow: inset 0 0 16px rgba(255, 230, 242, 0);
            transition: box-shadow 0.4s ease;
            pointer-events: none;
            z-index: 5;
        }

        .gif-card:hover::before {
            box-shadow: inset 0 0 18px rgba(255, 240, 247, 0.72);
        }

        /* Degradado inferior en las tarjetas GIF igual a la referencia */
        .gif-card-overlay {
            background: linear-gradient(
                to top,
                rgba(196, 104, 140, 0.94) 0%,
                rgba(214, 126, 160, 0.70) 38%,
                rgba(255, 255, 255, 0) 100%
            );
        }

        /* Animación sutil para el indicador En Línea */
        @keyframes pulse-online {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 0 0 5px rgba(46, 213, 115, 0);
            }
        }

        .online-dot {
            background-color: #2ed573;
            animation: pulse-online 2.2s infinite;
        }

        /* Sombra suave y Gradient Fade inferior para el render principal de FABI sin recorte superior */
        .fabi-render {
            position: relative;
            z-index: 2;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 84%, rgba(0, 0, 0, 0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 84%, rgba(0, 0, 0, 0) 100%);
        }

        /* 1. Efecto Hover en Avatares: Inner Shine + Zoom contenido en el círculo */
        .avatar-circle-inner {
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
            transform: translateZ(0);
        }

        .avatar-circle-inner img {
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        .avatar-circle-inner:hover img {
            transform: scale(1.18);
        }

        .avatar-circle-inner::after {
            content: '';
            position: absolute;
            top: 0;
            left: -135%;
            width: 85%;
            height: 100%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 240, 247, 0.58) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-24deg);
            transition: left 0.65s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 5;
        }

        .avatar-circle-inner:hover::after {
            left: 145%;
        }

        .avatar-circle-inner::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            box-shadow: inset 0 0 14px rgba(255, 255, 255, 0);
            transition: box-shadow 0.4s ease;
            pointer-events: none;
            z-index: 6;
        }

        .avatar-circle-inner:hover::before {
            box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.72);
        }

        /* Zoom inicial pronunciado y centrado en el rostro exclusivo para el avatar de FABI */
        .fabi-avatar-zoom {
            object-position: 50% 20%;
            transform: scale(1.48);
            transform-origin: 50% 24%;
        }
        /* Tarjeta desplegable hacia abajo al hacer clic en el avatar de FABI (Efecto Liquid Glass) */
        .fabi-avatar-popover {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 235px;
            border-radius: 22px;
            padding: 8px;
            background: linear-gradient(
                135deg,
                rgba(255, 220, 236, 0.32) 0%,
                rgba(232, 152, 186, 0.18) 100%
            );
            backdrop-filter: blur(12px) saturate(185%);
            -webkit-backdrop-filter: blur(12px) saturate(185%);
            border: 1px solid rgba(255, 206, 226, 0.72);
            box-shadow: 0 20px 42px -8px rgba(95, 32, 58, 0.36),
                        inset 0 1px 1.5px rgba(255, 220, 236, 0.82),
                        inset 0 -1px 1px rgba(255, 192, 218, 0.28);
            transform-origin: 28px top;
            transform: translateY(-10px) scaleY(0.25) scaleX(0.35);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.32s ease,
                        visibility 0.32s ease;
            z-index: 100;
        }

        .fabi-avatar-popover.is-open {
            transform: translateY(0) scaleY(1) scaleX(1);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* 2. Efecto Alternativo en el Render Principal: PREMIUM SOFT GLOW */
        .fabi-render-stage {
            position: relative;
            line-height: 0;
        }

        .fabi-glow-wrap {
            position: relative;
            display: block;
            line-height: 0;
            cursor: pointer;
            --glow-x: 50%;
            --glow-y: 50%;
            --glow-opacity: 0;
            filter: drop-shadow(-6px 8px 16px rgba(115, 45, 72, 0.28));
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, filter;
        }

        /* Halo difuso amplio sin bordes rectos que acompaña sutilmente al cursor detrás del render */
        .fabi-soft-aura {
            position: absolute;
            inset: -48px;
            pointer-events: none;
            z-index: 1;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            background: radial-gradient(
                170px circle at var(--glow-x, 50%) var(--glow-y, 50%),
                rgba(255, 245, 250, 0.68) 0%,
                rgba(255, 196, 220, 0.36) 38%,
                rgba(216, 122, 158, 0) 68%
            );
            filter: blur(16px);
            border-radius: 9999px;
        }

        @media (hover: hover) and (pointer: fine) {
            .fabi-glow-wrap:hover {
                transform: translateY(-4px) scale(1.03);
                filter:
                    drop-shadow(0 0 16px rgba(255, 240, 247, 0.65))
                    drop-shadow(-8px 14px 24px rgba(115, 45, 72, 0.36));
            }
        }

        /* Tooltip discreto para el icono Married en el perfil de Jhon */
        .married-badge-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .married-tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: rgba(74, 44, 56, 0.92);
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 4px 12px rgba(74, 44, 56, 0.28);
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
            z-index: 60;
        }

        .married-badge-wrap.is-tooltip-visible .married-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Estilos para Estados de Conexión API (Verde Online, Naranja Ausente, Gris Desconocido) */
        @keyframes pulse-away {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 159, 67, 0.7);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 0 0 5px rgba(255, 159, 67, 0);
            }
        }

        .status-dot-online {
            background-color: #2ed573;
            animation: pulse-online 2.2s infinite;
        }

        .status-dot-away {
            background-color: #ff9f43;
            animation: pulse-away 2.4s infinite;
        }

        @keyframes pulse-offline {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.75);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 0 0 5px rgba(255, 71, 87, 0);
            }
        }

        .status-dot-offline {
            background-color: #ff4757;
            animation: pulse-offline 2.2s infinite;
        }

        /* Reproductor Musical Glassmorphism con Slider Circular 3D — Liquid Glass iOS 26 */
        .music-glass-card {
            background: linear-gradient(
                135deg,
                rgba(255, 225, 238, 0.26) 0%,
                rgba(232, 158, 188, 0.14) 100%
            );
            backdrop-filter: blur(12px) saturate(190%);
            -webkit-backdrop-filter: blur(12px) saturate(190%);
            border: 1px solid rgba(255, 206, 226, 0.70);
            box-shadow: 0 14px 32px -8px rgba(105, 38, 66, 0.18),
                        inset 0 1px 1.5px rgba(255, 220, 235, 0.82),
                        inset 0 -1px 1px rgba(255, 192, 218, 0.25);
        }

        .carousel-3d-stage {
            perspective: 750px;
            position: relative;
            width: 118px;
            height: 118px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .cover-3d-item {
            position: absolute;
            width: 92px;
            height: 92px;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.55s ease,
                        filter 0.55s ease;
            border: 1.5px solid rgba(255, 210, 228, 0.85);
            cursor: pointer;
            will-change: transform, opacity;
        }

        .cover-3d-item.pos-center {
            transform: translate3d(0, 0, 26px) scale(1);
            opacity: 1;
            z-index: 30;
            box-shadow: 0 10px 22px -4px rgba(138, 62, 92, 0.38);
            filter: brightness(1);
        }

        .cover-3d-item.pos-left {
            transform: translate3d(-24px, 0, -22px) rotateY(28deg) scale(0.82);
            opacity: 0.68;
            z-index: 20;
            box-shadow: 0 6px 14px -4px rgba(138, 62, 92, 0.22);
            filter: brightness(0.92);
        }

        .cover-3d-item.pos-right {
            transform: translate3d(24px, 0, -22px) rotateY(-28deg) scale(0.82);
            opacity: 0.68;
            z-index: 20;
            box-shadow: 0 6px 14px -4px rgba(138, 62, 92, 0.22);
            filter: brightness(0.92);
        }

        .cover-3d-item.pos-hidden {
            transform: translate3d(0, 0, -55px) scale(0.6);
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* Controles y Sliders Liquid Glass iOS 26 del Reproductor (Compatibles con Chrome, Safari, Firefox, Opera) */
        .ios-glass-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(
                135deg,
                rgba(255, 236, 245, 0.46) 0%,
                rgba(232, 152, 186, 0.28) 100%
            );
            border: 1px solid rgba(255, 214, 232, 0.82);
            box-shadow: 0 6px 16px -3px rgba(105, 38, 66, 0.22),
                        inset 0 1px 1.5px rgba(255, 245, 250, 0.88),
                        inset 0 -1px 1px rgba(216, 122, 158, 0.28);
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(115, 38, 68, 0.45);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.28s ease,
                        background 0.28s ease,
                        border-color 0.28s ease;
        }

        .ios-glass-btn:hover {
            transform: translateY(-1.5px) scale(1.07);
            background: linear-gradient(
                135deg,
                rgba(255, 242, 248, 0.56) 0%,
                rgba(238, 165, 196, 0.36) 100%
            );
            border-color: rgba(255, 230, 242, 0.95);
            box-shadow: 0 10px 22px -4px rgba(125, 42, 74, 0.32),
                        0 0 12px rgba(255, 215, 232, 0.55),
                        inset 0 1px 2px rgba(255, 255, 255, 0.92);
        }

        .ios-glass-btn:active {
            transform: scale(0.95);
        }

        .ios-glass-btn-primary {
            background: linear-gradient(
                135deg,
                rgba(244, 143, 177, 0.56) 0%,
                rgba(216, 112, 152, 0.38) 100%
            );
            border: 1px solid rgba(255, 222, 236, 0.88);
            box-shadow: 0 8px 20px -4px rgba(115, 38, 68, 0.32),
                        inset 0 1.5px 2px rgba(255, 245, 250, 0.9),
                        inset 0 -1px 1.5px rgba(184, 92, 128, 0.35);
        }

        .ios-glass-pill {
            background: linear-gradient(
                135deg,
                rgba(255, 235, 244, 0.30) 0%,
                rgba(232, 162, 192, 0.16) 100%
            );
            border: 1px solid rgba(255, 212, 230, 0.65);
            box-shadow: inset 0 1px 1px rgba(255, 240, 247, 0.68),
                        0 4px 12px -3px rgba(105, 38, 66, 0.14);
        }

        .pastel-range {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background: linear-gradient(
                90deg,
                rgba(255, 230, 242, 0.58) 0%,
                rgba(255, 196, 220, 0.38) 100%
            );
            height: 6px;
            border-radius: 999px;
            border: 1px solid rgba(255, 220, 236, 0.72);
            box-shadow: inset 0 1px 2px rgba(115, 38, 68, 0.18),
                        0 1px 2px rgba(255, 240, 247, 0.5);
            outline: none;
            cursor: pointer;
        }

        .pastel-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #ffffff 0%, #ffd6e7 68%, #f48fb1 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 7px rgba(115, 38, 68, 0.42),
                        inset 0 1px 1.5px rgba(255, 255, 255, 0.95);
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease;
        }

        .pastel-range::-webkit-slider-thumb:hover {
            transform: scale(1.22);
            box-shadow: 0 0 10px rgba(255, 215, 232, 0.9),
                        0 3px 8px rgba(115, 38, 68, 0.48);
        }

        /* Soporte nativo para Mozilla Firefox */
        .pastel-range::-moz-range-track {
            background: linear-gradient(
                90deg,
                rgba(255, 230, 242, 0.58) 0%,
                rgba(255, 196, 220, 0.38) 100%
            );
            height: 6px;
            border-radius: 999px;
            border: 1px solid rgba(255, 220, 236, 0.72);
        }

        .pastel-range::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 30%, #ffffff 0%, #ffd6e7 68%, #f48fb1 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 7px rgba(115, 38, 68, 0.42),
                        inset 0 1px 1.5px rgba(255, 255, 255, 0.95);
            cursor: pointer;
            transition: transform 0.18s ease;
        }

        .pastel-range::-moz-range-thumb:hover {
            transform: scale(1.22);
        }

        /* ==========================================
           NUEVOS ESTILOS: RENDER DE TEXTO + SHINE2.PNG + INTRO SCREEN + PISCIS ICON
           ========================================== */
        .fabi-text-render-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            filter: drop-shadow(0 6px 16px rgba(138, 62, 92, 0.28));
        }

        .fabi-text-render-wrap:hover {
            transform: translateY(-3px) scale(1.025);
            filter:
                drop-shadow(0 0 14px rgba(255, 240, 247, 0.78))
                drop-shadow(0 10px 22px rgba(138, 62, 92, 0.38));
        }

        /* Imagen principal text.png conservando proporción y nitidez */

<body style="padding-top: 65px;" class="flex items-start justify-center pt-[65px] pb-8 px-4 sm:px-6 md:pb-12 lg:pb-14">

    <!-- ==========================================
         NUEVA PÁGINA DE INICIO – INTRO SCREEN
         ========================================== -->
    <div id="intro-screen" class="intro-screen-overlay" role="dialog" aria-modal="true" aria-label="Pantalla de bienvenida FABI">
        <div class="flex flex-col items-center justify-center max-w-[540px] w-full text-center gap-7">
            <!-- Render de texto central con Inner Shine y destellos realistas shine2.png -->
            <div class="fabi-text-render-wrap px-2">
                <img 
                    src="https://raw.githubusercontent.com/eamxat/Fabigifs/refs/heads/main/text.png" 
                    alt="FABI Intro Text Render" 
                    class="fabi-text-render-img w-[280px] sm:w-[370px] md:w-[430px] mx-auto select-none"
                >
                <div class="fabi-text-inner-shine" aria-hidden="true"></div>
                <div class="shine-sparkles-layer" aria-hidden="true">
                    <span class="real-sparkle sp-1"></span>
                    <span class="real-sparkle sp-2"></span>
                    <span class="real-sparkle sp-3"></span>
                    <span class="real-sparkle sp-4"></span>
                    <span class="real-sparkle sp-5"></span>
                </div>
            </div>

            <!-- Botón Flotante INGRESAR -->
            <button 
                id="intro-enter-btn" 
                type="button" 
                onclick="enterMainSite()" 
                class="intro-enter-btn"
            >
                INGRESAR
            </button>
        </div>
    </div>

    <!-- Shaders WebGL para el Efecto Liquid Fluid sobre el Background -->
    <script type="x-shader/x-fragment" id="vertShader">
        precision highp float;

        varying vec2 vUv;
        attribute vec2 a_position;

        varying vec2 vL;
        varying vec2 vR;
        varying vec2 vT;
        varying vec2 vB;
        uniform vec2 u_texel;

        void main () {
            vUv = .5 * (a_position + 1.);
            vL = vUv - vec2(u_texel.x, 0.);
            vR = vUv + vec2(u_texel.x, 0.);
            vT = vUv + vec2(0., u_texel.y);
            vB = vUv - vec2(0., u_texel.y);
            gl_Position = vec4(a_position, 0., 1.);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragShaderAdvection">
        precision highp float;
        precision highp sampler2D;

        varying vec2 vUv;
        uniform sampler2D u_velocity_texture;
        uniform sampler2D u_input_texture;
        uniform vec2 u_texel;
        uniform vec2 u_output_textel;
        uniform float u_dt;
        uniform float u_dissipation;

        vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
            vec2 st = uv / tsize - 0.5;

            vec2 iuv = floor(st);
            vec2 fuv = fract(st);

            vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
            vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
            vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
            vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);

            return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
        }

        void main () {
            vec2 coord = vUv - u_dt * bilerp(u_velocity_texture, vUv, u_texel).xy * u_texel;
            vec4 velocity = bilerp(u_input_texture, coord, u_output_textel);
            gl_FragColor = u_dissipation * velocity;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragShaderDivergence">
        precision highp float;
        precision highp sampler2D;

        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D u_velocity_texture;

        void main () {
            float L = texture2D(u_velocity_texture, vL).x;
            float R = texture2D(u_velocity_texture, vR).x;
            float T = texture2D(u_velocity_texture, vT).y;
            float B = texture2D(u_velocity_texture, vB).y;

            float div = .25 * (R - L + T - B);
            gl_FragColor = vec4(div, 0., 0., 1.);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragShaderPressure">
        precision highp float;
        precision highp sampler2D;

        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D u_pressure_texture;
        uniform sampler2D u_divergence_texture;

        void main () {
            float L = texture2D(u_pressure_texture, vL).x;
            float R = texture2D(u_pressure_texture, vR).x;
            float T = texture2D(u_pressure_texture, vT).x;
            float B = texture2D(u_pressure_texture, vB).x;
            float divergence = texture2D(u_divergence_texture, vUv).x;
            float pressure = (L + R + B + T - divergence) * .25;

            gl_FragColor = vec4(pressure, 0., 0., 1.);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragShaderGradientSubtract">
        precision highp float;
        precision highp sampler2D;

        varying highp vec2 vUv;
        varying highp vec2 vL;
        varying highp vec2 vR;
        varying highp vec2 vT;
        varying highp vec2 vB;
        uniform sampler2D u_pressure_texture;
        uniform sampler2D u_velocity_texture;

        void main () {
            float L = texture2D(u_pressure_texture, vL).x;
            float R = texture2D(u_pressure_texture, vR).x;
            float T = texture2D(u_pressure_texture, vT).x;
            float B = texture2D(u_pressure_texture, vB).x;
            vec2 velocity = texture2D(u_velocity_texture, vUv).xy;
            velocity.xy -= vec2(R - L, T - B);
            gl_FragColor = vec4(velocity, 0., 1.);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragShaderPoint">
        precision highp float;
        precision highp sampler2D;

        varying vec2 vUv;
        uniform sampler2D u_input_texture;
        uniform float u_ratio;
        uniform float u_img_ratio;
        uniform vec3 u_point_value;
        uniform vec2 u_point;
        uniform float u_point_size;

        void main () {
            vec2 p = vUv - u_point.xy;
            p.x *= u_ratio;
            vec3 splat = .6 * pow(2., -dot(p, p) / u_point_size) * u_point_value;

            vec3 base = texture2D(u_input_texture, vUv).xyz;
            gl_FragColor = vec4(base + splat, 1.);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragShaderOutputShader">
        precision highp float;
        precision highp sampler2D;

        varying vec2 vUv;
        uniform float u_ratio;
        uniform float u_img_ratio;
        uniform float u_disturb_power;
        uniform sampler2D u_output_texture;
        uniform sampler2D u_velocity_texture;
        uniform sampler2D u_text_texture;
        uniform vec2 u_point;
        uniform vec2 u_texel;

        vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
            vec2 st = uv / tsize - 0.5;
            vec2 iuv = floor(st);
            vec2 fuv = fract(st);

            vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
            vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
            vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
            vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);

            return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
        }

        vec2 get_img_uv() {
            vec2 img_uv = vUv - .5;
            if (u_ratio > u_img_ratio) {
                img_uv.y = img_uv.y * u_img_ratio / u_ratio;
            } else {
                img_uv.x = img_uv.x * u_ratio / u_img_ratio;
            }
            img_uv += .5;
            return img_uv;
        }

        void main () {
            float offset = bilerp(u_output_texture, vUv, u_texel).r;
            vec2 velocity = bilerp(u_velocity_texture, vUv, u_texel).xy;
            vec2 normVel = velocity / (length(velocity) + 0.08);

            vec2 img_uv = get_img_uv();
            img_uv -= u_disturb_power * normVel * offset;
            img_uv -= u_disturb_power * normVel * offset;
            img_uv = clamp(img_uv, 0.001, 0.999);

            vec3 img = texture2D(u_text_texture, vec2(img_uv.x, 1. - img_uv.y)).rgb;
            gl_FragColor = vec4(img, 1.);
        }
    </script>

    <!-- ==========================================
         LÓGICA JAVASCRIPT: RELOJ, API ONLINE REAL Y REPRODUCTOR 3D
         ========================================== -->
    <script>
        // 0. Interacción del SVG Heart (married) con explosión suave de corazones y tooltip controlado sin bloquearse
        const MARRIED_HEART_SVG_URL = 'https://beta.xat.com/assets/DYp8AWP5.svg';
        let activeHeartParticles = 0;
        const MAX_ACTIVE_HEARTS = 24;
        let marriedTooltipTouchTimer = null;

        function showMarriedTooltip() {
            const badge = document.getElementById('jhon-married-badge');
            if (!badge) return;
            if (marriedTooltipTouchTimer) {
                clearTimeout(marriedTooltipTouchTimer);
                marriedTooltipTouchTimer = null;
            }
            badge.classList.add('is-tooltip-visible');
        }

        function hideMarriedTooltip() {
            const badge = document.getElementById('jhon-married-badge');
            if (!badge) return;
            if (marriedTooltipTouchTimer) {
                clearTimeout(marriedTooltipTouchTimer);
                marriedTooltipTouchTimer = null;
            }
            badge.classList.remove('is-tooltip-visible');
        }

        function handleMarriedHeartClick(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const badge = document.getElementById('jhon-married-badge');
            if (!badge) return;

            spawnMarriedHeartsBurst(badge);

            // En dispositivos táctiles muestra el tooltip temporalmente y lo oculta automáticamente
            const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
            if (isTouch) {
                showMarriedTooltip();
                marriedTooltipTouchTimer = setTimeout(() => {
                    hideMarriedTooltip();
                }, 2000);
            }
        }

        function spawnMarriedHeartsBurst(originEl) {
            if (!originEl || activeHeartParticles >= MAX_ACTIVE_HEARTS) return;

            const rect = originEl.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;
            const count = 7;

            for (let i = 0; i < count; i++) {
                if (activeHeartParticles >= MAX_ACTIVE_HEARTS) break;
                activeHeartParticles++;

                const heart = document.createElement('img');
                heart.src = MARRIED_HEART_SVG_URL;
                heart.alt = '';
                heart.setAttribute('aria-hidden', 'true');
                heart.className = 'floating-married-heart';

                const size = 12 + Math.floor(Math.random() * 8); // 12px a 19px
                const spreadX = (Math.random() - 0.5) * 68;     // dispersión horizontal suave
                const riseY = -(38 + Math.random() * 52);       // elevación vertical
                const rot = (Math.random() - 0.5) * 46;         // rotación ligera
                const scale = (0.78 + Math.random() * 0.42).toFixed(2);
                const duration = Math.round(900 + Math.random() * 450);
                const delay = Math.round(i * 38);

                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.left = `${startX - size / 2}px`;
                heart.style.top = `${startY - size / 2}px`;
                heart.style.setProperty('--tx', `${spreadX.toFixed(1)}px`);
                heart.style.setProperty('--ty', `${riseY.toFixed(1)}px`);
                heart.style.setProperty('--rot', `${rot.toFixed(1)}deg`);
                heart.style.setProperty('--heart-scale', scale);
                heart.style.setProperty('--heart-dur', `${duration}ms`);
                heart.style.animationDelay = `${delay}ms`;

                document.body.appendChild(heart);

                const cleanup = () => {
                    if (heart.parentNode) {
                        heart.parentNode.removeChild(heart);
                    }
                    activeHeartParticles = Math.max(0, activeHeartParticles - 1);
                };

                heart.addEventListener('animationend', cleanup, { once: true });
                setTimeout(cleanup, duration + delay + 120);
            }
        }

        document.addEventListener('click', (e) => {
            const badge = document.getElementById('jhon-married-badge');
            if (badge && !badge.contains(e.target)) {
                hideMarriedTooltip();
            }
        });

        // 1. Reloj y Calendario Funcional en Tiempo Real en Español (es-MX)
        function capitalizeSpanishWord(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
        }

        function updateLiveClock() {
            const now = new Date();

            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'p. m.' : 'a. m.';

            hours = hours % 12;
            hours = hours ? hours : 12;

            const paddedMinutes = String(minutes).padStart(2, '0');
            const paddedSeconds = String(seconds).padStart(2, '0');

            const hmElement = document.getElementById('clock-hm');
            const secElement = document.getElementById('clock-sec');
            const ampmElement = document.getElementById('clock-ampm');

            if (hmElement) hmElement.textContent = `${hours}:${paddedMinutes}`;
            if (secElement) secElement.textContent = `${paddedSeconds}s`;
            if (ampmElement) ampmElement.textContent = ampm;

            // Formateo explícito con localización es-MX
            const rawWeekday = new Intl.DateTimeFormat('es-MX', { weekday: 'long' }).format(now);
            const rawMonth = new Intl.DateTimeFormat('es-MX', { month: 'long' }).format(now);
            const dayNum = now.getDate();
            const year = now.getFullYear();

            const weekdayName = capitalizeSpanishWord(rawWeekday.replace(/[.,]/g, ''));
            const monthName = capitalizeSpanishWord(rawMonth.replace(/[.,]/g, ''));

            const weekdayEl = document.getElementById('clock-weekday');
            const monthYearEl = document.getElementById('clock-month-year');

            if (weekdayEl) weekdayEl.textContent = weekdayName;
            if (monthYearEl) monthYearEl.textContent = `${dayNum} de ${monthName} ${year}`;
        }

        updateLiveClock();
        setInterval(updateLiveClock, 1000);

        // 2. Sistema de Estado Online con API Real independiente para FABI y JHON
        const STATUS_ENDPOINTS = {
            fabi: {
                url: 'https://illuxat.com/api/online/Faby',
                dotId: 'fabi-status-dot',
                textId: 'fabi-status-text'
            },
            jhon: {
                url: 'https://illuxat.com/api/online/Jhon',
                dotId: 'jhon-status-dot',
                textId: 'jhon-status-text'
            }
        };

        function extractApiStatusString(payload) {
            if (!payload) return '';
            if (typeof payload === 'string') return payload.trim();
            if (typeof payload === 'object') {
                // Busca el campo de estado en posibles estructuras JSON devueltas por la API
                const candidates = [
                    payload.status,
                    payload.state,
                    payload.online,
                    payload.result,
                    payload.message,
                    payload.data && payload.data.status,
                    payload.data && payload.data.state,
                    payload.data
                ];
                for (const item of candidates) {
                    if (typeof item === 'string' && item.trim().length > 0) {
                        return item.trim();
                    }
                }
            }
            return '';
        }

        function applyProfileStatus(dotEl, textEl, rawStatus) {
            if (!dotEl || !textEl) return;

            const normalized = String(rawStatus || '').trim().toLowerCase();

            // Reiniciar clases de color del indicador manteniendo sus dimensiones
            dotEl.classList.remove('status-dot-online', 'status-dot-away', 'status-dot-offline');
            dotEl.removeAttribute('title');

            if (normalized === 'online') {
                dotEl.classList.add('status-dot-online');
                textEl.textContent = 'En línea';
            } else if (normalized === 'available') {
                // Available = Ausente (Naranja), NO conectado
                dotEl.classList.add('status-dot-away');
                textEl.textContent = 'Ausente';
            } else {
                // Estado desconectado, offline o sin respuesta: texto Desconectado + círculo rojo parpadeante
                dotEl.classList.add('status-dot-offline');
                textEl.textContent = 'Desconectado';
            }
        }

        async function checkSingleUserStatus(profileConfig) {
            const dotEl = document.getElementById(profileConfig.dotId);
            const textEl = document.getElementById(profileConfig.textId);

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
                const response = await fetch(profileConfig.url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json, text/plain, */*' },
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    applyProfileStatus(dotEl, textEl, 'unknown');
                    return;
                }

                const contentType = response.headers.get('content-type') || '';
                let statusValue = '';

                if (contentType.includes('application/json')) {
                    const jsonData = await response.json();
                    statusValue = extractApiStatusString(jsonData);
                } else {
                    const rawText = await response.text();
                    try {
                        const parsed = JSON.parse(rawText);
                        statusValue = extractApiStatusString(parsed);
                    } catch (_) {
                        statusValue = rawText.trim();
                    }
                }

                applyProfileStatus(dotEl, textEl, statusValue);
            } catch (error) {
                clearTimeout(timeoutId);
                applyProfileStatus(dotEl, textEl, 'unknown');
            }
        }

        function refreshAllStatuses() {
            checkSingleUserStatus(STATUS_ENDPOINTS.fabi);
            checkSingleUserStatus(STATUS_ENDPOINTS.jhon);
        }

        // Consulta inicial inmediata y actualización periódica cada 30 segundos
        refreshAllStatuses();
        setInterval(refreshAllStatuses, 30000);

        // 3. Reproductor Musical Funcional con Slider Circular 3D (Rutas listas para GitHub: track1.mp3 a track4.mp3)
        const PLAYLIST_3D = [
            {
                // Track 1
                title: 'Engel',
                artist: 'RAMMSTEIN',
                itunesQuery: 'Rammstein Engel',
                cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=400&q=80&fm=jpg',
                src: 'track1.mp3'
            },
            {
                // Track 2
                title: 'Te Amo, Te Extraño',
                artist: 'GUAYACÁN ORQUESTA',
                itunesQuery: 'Guayacan Orquesta Te Amo Te Extrano',
                cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=400&q=80&fm=jpg',
                src: 'track2.mp3'
            },
            {
                // Track 3
                title: 'Adan y Eva',
                artist: 'PAULO LONDRA',
                itunesQuery: 'Paulo Londra Adan y Eva',
                cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=400&q=80&fm=jpg',
                src: 'track3.mp3'
            },
            {
                // Track 4
                title: 'Prequel',
                artist: 'FALLING IN REVERSE',
                itunesQuery: 'Falling In Reverse Prequel',
                cover: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=400&q=80&fm=jpg',
                src: 'track4.mp3'
            }
        ];

        let currentTrackIndex = 0;
        let isPlayingMusic = false;
        const audioPlayer = new Audio();
        audioPlayer.preload = 'metadata';
        audioPlayer.volume = 0.75;
        audioPlayer.src = PLAYLIST_3D[0].src;

        function renderPlaylistUI() {
            const carouselStage = document.getElementById('cover-carousel-3d');
            if (carouselStage) {
                carouselStage.innerHTML = PLAYLIST_3D.map((track, idx) => `
                    <div class="cover-3d-item" data-index="${idx}" onclick="selectTrackByIndex(${idx})">
                        <img id="cover-img-3d-${idx}" src="${track.cover}" alt="${track.title}" class="w-full h-full object-cover">
                    </div>
                `).join('');
            }

            const listContainer = document.getElementById('playlist-tracks-container');
            if (listContainer) {
                listContainer.innerHTML = PLAYLIST_3D.map((track, idx) => `
                    <button 
                        type="button"
                        id="playlist-row-${idx}"
                        onclick="selectTrackByIndex(${idx})"
                        class="playlist-track-row w-full flex items-center gap-3 px-2.5 py-1.5 rounded-xl border border-transparent hover:bg-white/45 text-left"
                    >
                        <img 
                            id="playlist-thumb-${idx}" 
                            src="${track.cover}" 
                            alt="${track.title}" 
                            class="w-9 h-9 rounded-lg object-cover flex-shrink-0 border border-white/80 shadow-sm"
                        >
                        <div class="min-w-0 flex-1 leading-tight">
                            <div class="player-title-gradient font-bold text-xs sm:text-[13px] truncate block">${track.title}</div>
                            <div class="player-sub-gradient text-[10px] sm:text-[11px] font-semibold tracking-wider uppercase truncate block mt-0.5">${track.artist}</div>
                        </div>
                    </button>
                `).join('');
            }

            update3DCoverPositions();
        }

        // Obtiene automáticamente las portadas JPG oficiales desde iTunes respetando los archivos locales track1.mp3 - track4.mp3
        async function enrichTracksFromItunes() {
            await Promise.all(PLAYLIST_3D.map(async (track, idx) => {
                if (!track.itunesQuery) return;
                try {
                    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(track.itunesQuery)}&entity=song&limit=1`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data && data.results && data.results.length > 0) {
                        const item = data.results[0];
                        if (item.artworkUrl100) {
                            track.cover = item.artworkUrl100.replace('100x100bb', '400x400bb');
                            const img3d = document.getElementById(`cover-img-3d-${idx}`);
                            const thumb = document.getElementById(`playlist-thumb-${idx}`);
                            if (img3d) img3d.src = track.cover;
                            if (thumb) thumb.src = track.cover;
                        }
                    }
                } catch (_) {
                    // Conserva el cover JPG de respaldo si no hay conexión externa
                }
            }));
        }

        function formatSeconds(sec) {
            if (!isFinite(sec) || sec < 0) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function update3DCoverPositions() {
            const items = document.querySelectorAll('#cover-carousel-3d .cover-3d-item');
            const total = items.length;

            items.forEach((item, index) => {
                item.classList.remove('pos-center', 'pos-left', 'pos-right', 'pos-hidden');
                const diff = (index - currentTrackIndex + total) % total;

                if (diff === 0) {
                    item.classList.add('pos-center');
                } else if (diff === 1) {
                    item.classList.add('pos-right');
                } else if (diff === total - 1) {
                    item.classList.add('pos-left');
                } else {
                    item.classList.add('pos-hidden');
                }
            });

            PLAYLIST_3D.forEach((_, idx) => {
                const row = document.getElementById(`playlist-row-${idx}`);
                if (row) {
                    if (idx === currentTrackIndex) {
                        row.classList.add('active-track');
                    } else {
                        row.classList.remove('active-track');
                    }
                }
            });

            const titleEl = document.getElementById('player-title');
            const artistEl = document.getElementById('player-artist');
            if (titleEl) titleEl.textContent = PLAYLIST_3D[currentTrackIndex].title;
            if (artistEl) artistEl.textContent = PLAYLIST_3D[currentTrackIndex].artist;
        }

        renderPlaylistUI();
        enrichTracksFromItunes();

        // Función de entrada desde la Intro Screen con activación de audio en la primera pista
        function enterMainSite() {
            const introScreen = document.getElementById('intro-screen');
            if (introScreen) {
                introScreen.classList.add('is-hidden');
            }

            currentTrackIndex = 0;
            update3DCoverPositions();
            audioPlayer.src = PLAYLIST_3D[0].src;
            audioPlayer.play().then(() => {
                isPlayingMusic = true;
                syncPlayIcon();
            }).catch(() => {
                isPlayingMusic = false;
                syncPlayIcon();
            });
        }

        function loadCurrentTrack(autoPlay) {
            update3DCoverPositions();
            audioPlayer.src = PLAYLIST_3D[currentTrackIndex].src;
            audioPlayer.load();

            const progressEl = document.getElementById('player-progress');
            const currentTimeEl = document.getElementById('player-current-time');
            if (progressEl) progressEl.value = 0;
            if (currentTimeEl) currentTimeEl.textContent = '0:00';

            if (autoPlay) {
                audioPlayer.play().then(() => {
                    isPlayingMusic = true;
                    syncPlayIcon();
                }).catch(() => {
                    isPlayingMusic = false;
                    syncPlayIcon();
                });
            }
        }

        function syncPlayIcon() {
            const icon = document.getElementById('player-play-icon');
            if (!icon) return;
            icon.className = isPlayingMusic ? 'ph-fill ph-pause text-lg' : 'ph-fill ph-play text-lg';
        }

        function togglePlayMusic() {
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    isPlayingMusic = true;
                    syncPlayIcon();
                }).catch(() => {
                    isPlayingMusic = false;
                    syncPlayIcon();
                });
            } else {
                audioPlayer.pause();
                isPlayingMusic = false;
                syncPlayIcon();
            }
        }

        function nextTrack3D() {
            currentTrackIndex = (currentTrackIndex + 1) % PLAYLIST_3D.length;
            loadCurrentTrack(isPlayingMusic);
        }

        function prevTrack3D() {
            currentTrackIndex = (currentTrackIndex - 1 + PLAYLIST_3D.length) % PLAYLIST_3D.length;
            loadCurrentTrack(isPlayingMusic);
        }

        function selectTrackByIndex(index) {
            if (index === currentTrackIndex) {
                togglePlayMusic();
                return;
            }
            currentTrackIndex = index;
            loadCurrentTrack(true);
        }

        function togglePlayerLike() {
            const btn = document.getElementById('player-like-btn');
            if (!btn) return;
            const icon = btn.querySelector('i');
            if (icon) {
                icon.classList.toggle('text-white');
                icon.classList.toggle('text-pastel-100');
            }
        }

        // Eventos del reproductor de audio
        audioPlayer.addEventListener('loadedmetadata', () => {
            const durationEl = document.getElementById('player-duration');
            if (durationEl && isFinite(audioPlayer.duration)) {
                durationEl.textContent = formatSeconds(audioPlayer.duration);
            }
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const progressEl = document.getElementById('player-progress');
            const currentTimeEl = document.getElementById('player-current-time');
            if (currentTimeEl) {
                currentTimeEl.textContent = formatSeconds(audioPlayer.currentTime);
            }
            if (progressEl && isFinite(audioPlayer.duration) && audioPlayer.duration > 0) {
                progressEl.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            }
        });

        audioPlayer.addEventListener('ended', () => {
            nextTrack3D();
        });

        const progressInput = document.getElementById('player-progress');
        if (progressInput) {
            progressInput.addEventListener('input', (e) => {
                if (isFinite(audioPlayer.duration) && audioPlayer.duration > 0) {
                    const seekTime = (parseFloat(e.target.value) / 100) * audioPlayer.duration;
                    audioPlayer.currentTime = seekTime;
                }
            });
        }

        const volumeInput = document.getElementById('player-volume');
        if (volumeInput) {
            volumeInput.addEventListener('input', (e) => {
                audioPlayer.volume = parseFloat(e.target.value);
            });
        }

        // 4. Interactividad de las barras del Hero Banner
        const heroMessages = [
            "Un rincón delicado en tonos rosa pastel creado para compartir mi estilo, creatividad y momentos favoritos. Amante de la estética suave, los detalles brillantes y la música tranquila que acompaña cada día en este espacio especial.",
            "Me encanta coleccionar momentos bonitos, diseñar espacios acogedores y disfrutar de una estética limpia y armoniosa. ¡Gracias por visitar mi perfil oficial y formar parte de esta comunidad!",
            "Siempre en línea para compartir nuevas ideas, inspiraciones y pequeños detalles en tonos pastel. Explora los recuadros animados para conocer cada faceta de FABI."
        ];

            if (aboutText && heroMessages[index]) {
                aboutText.style.opacity = '0';

                    aboutText.textContent = heroMessages[index];

        // 5. Ampliación vertical fluida del Avatar de FABI al hacer clic
        function toggleFabiAvatarExpand(event) {
            if (event) event.stopPropagation();
            const popover = document.getElementById('fabi-avatar-popover');
            const trigger = document.getElementById('fabi-avatar-trigger');
            if (!popover) return;

            const isOpen = popover.classList.toggle('is-open');
            if (trigger) {
                trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            }
        }

        function closeFabiAvatarExpand(event) {
            if (event) event.stopPropagation();
            const popover = document.getElementById('fabi-avatar-popover');
            const trigger = document.getElementById('fabi-avatar-trigger');
            if (popover && popover.classList.contains('is-open')) {
                popover.classList.remove('is-open');
                if (trigger) trigger.setAttribute('aria-expanded', 'false');
            }
        }

        document.addEventListener('click', (e) => {
            const popover = document.getElementById('fabi-avatar-popover');
            const trigger = document.getElementById('fabi-avatar-trigger');
            if (!popover || !popover.classList.contains('is-open')) return;
            if (!popover.contains(e.target) && (!trigger || !trigger.contains(e.target))) {
                closeFabiAvatarExpand();

            if (e.key === 'Escape') {
                closeFabiAvatarExpand();

        if (fabiAvatarTrigger) {
            fabiAvatarTrigger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleFabiAvatarExpand(e);
                }
            });
